name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Create Android project
        run: |
          mkdir www
          cp "$(ls *.html | head -n 1)" www/index.html
          npm init -y
          npm install @capacitor/core @capacitor/android @capacitor-community/admob
          npm install -D @capacitor/cli
          printf '{"appId":"com.earningbaby.app","appName":"Earning Baby","webDir":"www"}' > capacitor.config.json
          npx cap add android
          sed -i 's#</application>#<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-6112694873856564~3078937863"/></application>#' android/app/src/main/AndroidManifest.xml
          npx cap sync android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
